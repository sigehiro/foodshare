<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <title>Food Posting</title>
</head>
<body>
  <div class="main">
    <header th:include="@{/fragments/nav.html}"></header>

    <div class="content">

      <h1>Food Posting Form</h1>
      <form action="/post-food" method="post">
        <!-- Add input fields -->
        <label for="foodType">Food Type:</label>
        <input type="text" id="foodType" name="foodType" required><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" required><br>

        <label for="allergenInfo">Allergen Information:</label>
        <input type="text" id="allergenInfo" name="allergenInfo"><br>

        <label for="pickupLocation">Pickup Time/Location:</label>
        <input type="text" id="pickupLocation" name="pickupLocation"><br>

        <button type="submit">Post</button>
      </form>


    </div>
    <footer th:include="@{fragments/footer.html}"></footer>
  </div>
</body>
</html>
