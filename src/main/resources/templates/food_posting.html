<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <title>Food Posting</title>
</head>
<body>
<div class="main">
  <header th:include="@{/fragments/nav.html}"></header>

  <div class="content">
    <h1>Food Posting Form</h1>
    <form action="/foodshare/save" method="post" th:object="${foodItem}">
      <!-- Add input fields -->
      <div>
        <label for="foodType">Type of food</label>
        <input type="text" id="foodType" th:field="*{foodType}" required>
      </div>

      <div>
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" th:field="*{quantity}" required>
      </div>

      <div>
        <label for="allergenInfo">Allergen Information</label>
        <input type="text" id="allergenInfo" th:field="*{allergenInfo}">
      </div>

      <div>
        <label for="pickupTime">Pickup Time</label>
        <input type="text" id="pickupTime" th:field="*{pickupTime}">
      </div>

      <div>
        <label for="location">Location:</label>
        <input type="text" id="location" th:field="*{location}">
      </div>

<!--      #TODO add the following fields to the form-->
<!--      <div>-->
<!--        <label for="station">Selection from ali stop near by stations</label>-->
<!--        <input type="text" id="station" th:field="*{station}">-->
<!--      </div>-->

<!--      <div>-->
<!--        <label for="food-image">Image:</label>-->
<!--        <input type="text" id="food-image" th:field="*{food-image}">-->
<!--      </div>-->

      <button type="submit">Post</button>
    </form>

    <!--     #TODO pagination -->


  </div>
  <footer th:include="@{fragments/footer.html}"></footer>
</div>
</body>
</html>
