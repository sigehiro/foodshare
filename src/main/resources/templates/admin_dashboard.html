<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <title>Admin Dashboard</title>
  <style>
    body {
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 0 15px;
    }

    footer {
      text-align: center;
      margin-top: auto;
      position: sticky;
      bottom: 0;
    }

    .table-container {
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }

    th {
      background-color: #bfbfbf !important;
    }


    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #dee2e6;
    }

    th {
      background-color: #f1f1f1;
      font-weight: bold;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #eef2f7;
    }

    .frozen-row {
      background-color: #f8d7da;
    }

    .frozen-row > td {
      color: red;
      font-weight: bold;
    }

    .btn-custom {
      transition: background-color 0.3s, color 0.3s;
    }

    .btn-custom:hover {
      background-color: #218838;
      color: white;
    }
  </style>
</head>
<body>
<div class="main">
  <header th:replace="fragments/nav :: nav"></header>
  <div class="content">
    <div class="container mt-4 table-container">
      <h2 class="text-center">Admin Dashboard</h2>
      <table class="table table-hover">
        <thead>
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>User Type</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}" th:class="${user.isActive ? 'active-row' : 'frozen-row'}">
          <td th:text="${user.username}"></td>
          <td th:text="${user.email}"></td>
          <td th:text="${user.userType}"></td>
          <td th:text="${user.isActive ? 'Active' : 'Frozen'}"></td>
          <td>
            <form th:action="@{/foodshare/admin/delete}" method="post" style="display:inline;">
              <input type="hidden" name="email" th:value="${user.email}"/>
              <button type="submit" class="btn btn-danger btn-sm btn-custom">Delete</button>
            </form>

            <form th:action="@{/foodshare/admin/freeze}" method="post" style="display:inline;">
              <input type="hidden" name="email" th:value="${user.email}"/>
              <button type="submit" class="btn btn-warning btn-sm btn-custom">Freeze</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
  <hr>
  <!--message window for admin to respond to user messages shows only when messages are present -->
  <h3>User Chat Messages</h3>

  <div th:if="${messages.isEmpty()}">
    <p>No messages yet.</p>
  </div>

  <div th:each="msg : ${messages}">
    <div style="margin-bottom: 15px;">
      <strong th:text="${msg.sender}">Sender</strong>:
      <span th:text="${msg.content}"></span> <br/>
      <em th:text="${#temporals.format(msg.timestamp, 'yyyy-MM-dd HH:mm')}"></em> <br/>

      <div th:if="${msg.reply}">
        <strong>Admin Reply:</strong> <span th:text="${msg.reply}"></span>
      </div>

      <form th:action="@{/foodshare/admin/reply}" method="post" style="margin-top: 5px;">
        <input type="hidden" name="messageId" th:value="${msg.id}" />
        <input type="text" name="reply" placeholder="Write a reply..." class="form-control" />
        <button type="submit" class="btn btn-sm btn-primary">Reply</button>
      </form>
    </div>
  </div>


  <footer th:include="@{fragments/footer.html}"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
