<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <title>Admin Dashboard</title>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    footer {
      text-align: center;
      margin-top: auto;
    }

    .table-container {
      margin-top: 20px;
      border-radius: 8px;
      overflow: hidden;
    }

    th {
      background-color: #bfbfbf !important ;

    }

    .active-row {
      background-color: #d4edda;
    }

    .frozen-row {
      background-color: #f8d7da;
    }

    .frozen-row > td{
        color: red;
    }
    th>tr{
      padding-left: 10px;
    }
    .btn-custom {
      transition: background-color 0.3s, color 0.3s;
    }

    .btn-custom:hover {
      background-color: #218838;
      color: white;
    }

  </style>
</head>
<body>
<div class="main">
    <header th:replace="fragments/nav :: nav"></header>
      <div class="content">
        <div class="container mt-4 table-container">
          <h2 class="text-center">Admin Dashboard</h2>
          <table class="table table-striped table-hover">
            <thead>
            <tr>
    <!--          <th>ID</th>-->
              <th>Username</th>
              <th>Email</th>
              <th>User Type</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}"
                th:class="${user.isActive ? 'active-row' : 'frozen-row'}">
    <!--          <td th:text="${user.id}"></td>-->
              <td th:text="${user.username}"></td>
              <td th:text="${user.email}"></td>
              <td th:text="${user.userType}"></td>
              <td th:text="${user.isActive ? 'Active' : 'Frozen'}"></td>
              <td>
                <form th:action="@{/foodshare/admin/delete}" method="post" style="display:inline;">
                  <input type="hidden" name="email" th:value="${user.email}"/>
                  <button type="submit" class="btn btn-danger btn-sm btn-custom">Delete</button>
                </form>

                <form th:action="@{/foodshare/admin/freeze}" method="post" style="display:inline;">
                  <input type="hidden" name="email" th:value="${user.email}"/>
                  <button type="submit" class="btn btn-warning btn-sm btn-custom">Freeze</button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    <footer th:include="@{fragments/footer.html}"></footer>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
