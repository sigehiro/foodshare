<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <title>Register - FoodShare Connect</title>
  <style>
    .auth-container {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      background: white;
    }
    .form-control:focus {
      border-color: #28a745;
      box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
    }
  </style>
</head>
<body>
<div class="main">
  <header th:include="@{/fragments/nav.html}"></header>

  <div class="content auth-container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <h2 class="fw-bold mb-3">Create Account</h2>
        <p class="text-muted">Join the FoodShare community</p>
      </div>

      <form action="/register" method="post">
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" class="form-control form-control-lg"
                 id="name" name="name" required
                 placeholder="Enter your full name">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control form-control-lg"
                 id="email" name="email" required
                 placeholder="Enter your email">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control form-control-lg"
                 id="password" name="password" required
                 placeholder="Create a password">
        </div>

        <div class="mb-4">
          <label for="userType" class="form-label">User Type</label>
          <select class="form-select form-control-lg"
                  name="userType" id="userType" required>
            <option value="" disabled selected>Select User Type:</option>
            <option value="donor">Food Donor</option>
            <option value="recipient">Recipient Organization</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
          Create Account
        </button>

        <div class="text-center pt-3">
          <p class="text-muted">Already have an account?
            <a th:href="@{/foodshare/sign-in}" class="text-decoration-none text-primary">
              Sign in here
            </a>
          </p>
        </div>
      </form>
    </div>
  </div>

  <footer th:include="@{fragments/footer.html}"></footer>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
