<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <title>User Dashboard</title>
</head>
<body>
<div class="main">
  <header th:include="@{/fragments/nav.html}"></header>

  <div class="content">
    <h1>User Dashboard</h1>
    <h2>History Overview</h2>

    <div>
      <table class="table">
      <thead>
      <tr>
        <th>Type of Food</th>
        <th>Quantity</th>
        <th>Allergen Information</th>
        <th>Pickup Time</th>
        <th>Location</th>
      </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${wantedItems}">
          <td th:text="${item.foodType}"></td>
          <td th:text="${item.quantity}"></td>
          <td th:text="${item.allergenInfo}"></td>
          <td th:text="${item.pickupTime}"></td>
          <td th:text="${item.location}"></td>
        </tr>
      </tbody>
    </table>
    </div>
  </div>


  <footer th:include="@{fragments/footer.html}"></footer>
</div>
</body>
</html>
