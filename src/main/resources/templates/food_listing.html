<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <title>Food Listing</title>
</head>
<body>
<div class="main">
  <header th:include="@{/fragments/nav.html}"></header>

  <div class="content">
    <h1>Food Listing</h1>

    <table class="table">
      <thead>
        <tr>
          <th>Type of Food</th>
          <th>Quantity</th>
          <th>Allergen Information</th>
          <th>Pickup Time</th>
          <th>Location</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${foodItems}">
          <td th:text="${item.foodType}"></td>
          <td th:text="${item.quantity}"></td>
          <td th:text="${item.allergenInfo}"></td>
          <td th:text="${item.pickupTime}"></td>
          <td th:text="${item.location}"></td>
          <td>
            <!-- Want button -->
            <form action="/foodshare/want-food" method="post" style="display:inline;">
              <input type="hidden" name="id" th:value="${item.id}" />
              <button type="submit" class="btn btn-primary">Want</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>

<!--     #TODO pagination -->

  </div>

  <footer th:include="@{fragments/footer.html}"></footer>
</div>
</body>
</html>
