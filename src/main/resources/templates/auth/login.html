<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Sign In - FoodShare Connect</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .auth-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background: white;
        }
        .form-control:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
        }

        footer {
            text-align: center;
            margin-top: auto;
        }
    </style>
</head>
<body>
<div class="main">
    <header th:replace="fragments/nav :: nav"></header>
    <div class="auth-container">
        <div class="auth-card">
            <div class="text-center mb-4">
                <h2 class="fw-bold mb-3">Sign In</h2>
                <p class="text-muted">Welcome back! Please log in to your account.</p>
            </div>

            <div class="text-center mb-3">
                <!-- Message success or error -->
                <div class="alert alert-success" th:text="${message}" th:if="${message != null}"></div>
                <div class="alert alert-danger" th:if="${param.error}">Invalid email or password.</div>
            </div>

            <form th:action="@{/login}" method="post">
                <!-- CSRF Token -->
                <input type="hidden" name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address:</label>
                    <input type="email" id="email" name="username" class="form-control" required placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password:</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Log In</button>
            </form>

            <div class="text-center pt-3">
                <p class="text-muted">Don't have an account?
                    <a th:href="@{/register}" class="text-decoration-none text-primary">Register Here</a>
                </p>
            </div>
        </div>
    </div>
    <footer th:include="@{fragments/footer.html}"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
