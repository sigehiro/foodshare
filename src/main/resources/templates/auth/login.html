<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Sign In</title>
</head>
<body>
    <div class="main">
        <header th:include="@{/fragments/nav.html}"></header>
        <div class="content">
            <h1>Sign In</h1>

            <div class="text-center mb-3">
                <!-- Message success or error -->
                <div class="alert alert-success" th:text="${message}" th:if="${message != null}"></div>
                <div class="alert alert-danger" th:if="${param.error}">Invalid email or password.</div>
            </div>

            <!-- Display user information and activities here -->
            <form th:action="@{/login}" method="post">
                    <!-- CSRF Token -->
                    <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required><br>
<!--                    <label for="username">Username:</label>-->
<!--                    <input type="text" id="username" name="username" required><br>-->

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required><br>

                    <button type="submit">Log In</button>
            </form>
            <p><a th:href="@{/register}">Register Here</a></p>
        </div>
        <footer th:include="@{fragments/footer.html}"></footer>
    </div>
</body>
</html>
