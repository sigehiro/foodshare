<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Sign In - FoodShare Connect</title>
    <style>
        .auth-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background: white;
        }
        .form-control:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
        }
    </style>
</head>
<body>
<div class="main">
    <header th:include="@{/fragments/nav.html}"></header>

    <div class="content auth-container">
        <div class="auth-card">
            <div class="text-center mb-4">
                <h2 class="fw-bold mb-3">Welcome Back!</h2>
                <p class="text-muted">Sign in to continue to FoodShare Connect</p>
            </div>

            <form action="/login" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control form-control-lg"
                           id="email" name="email" required
                           placeholder="Enter your email">
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control form-control-lg"
                           id="password" name="password" required
                           placeholder="Enter your password">
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                    Sign In
                </button>

                <div class="text-center pt-3">
                    <p class="text-muted">Don't have an account?
                        <a th:href="@{/foodshare/register}" class="text-decoration-none text-primary">
                            Create account
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <footer th:include="@{fragments/footer.html}"></footer>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
